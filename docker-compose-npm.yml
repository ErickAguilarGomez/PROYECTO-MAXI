services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-npm
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
    volumes:
      - ./npm-data:/data
      - ./npm-letsencrypt:/etc/letsencrypt
    networks:
      - jeilu-net

networks:
  jeilu-net:
    external: true